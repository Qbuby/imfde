# imfde.ai Nginx 反代配置模板（生产部署）
#
# 架构：同域 nginx，把请求分发给两部分——
#   - /            → 静态门户（index.html + demand/project/fde/learn 等 .html + assets/ + docs/）
#   - /portal/*    → Python 内容服务（127.0.0.1:8850，世界动态/落地/现场/案例/方法/world3d）
#
# 首页内容导航带(index.html)与 learn.html 里的入口用的是 /portal/* 同源相对路径，
# 所以必须把 /portal/ 反代到内容服务才能点通。
#
# 用法：
#   1. 把本仓库放到 /srv/imfde（静态部分可直接用 root 指向它）
#   2. 内容服务：IMFDE_PORTAL_URL=https://imfde.ai/index.html python3 portal/site/server.py
#   3. 把本文件放到 /etc/nginx/conf.d/imfde.conf 后 nginx -s reload
#   4. 域名指向本机；HTTPS 交给 certbot 或已有证书

server {
    listen 80;
    server_name imfde.ai www.imfde.ai;

    # ---- 内容服务：世界动态 / 落地 / 现场 / 案例 / 方法 / world3d ----
    # 关键：proxy_pass 末尾带 "/" 会把 URI 前缀 /portal 剥掉，
    # 因此 /portal/世界动态 → 内容服务 /世界动态
    location /portal/ {
        proxy_pass http://127.0.0.1:8850/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # 3D 沙盘与流式日志可能需要长连接
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ---- 内容服务直接根路径（可选：让 8850 也直接可见）----
    # 若想让 /世界动态 不带前缀访问，可再加这段；与上一段同源会冲突，
    # 建议只保留一种：要么都用 /portal/* 前缀，要么都在子域名。
    # location /世界动态 { proxy_pass http://127.0.0.1:8850; ... }

    # ---- 静态门户 ----
    location / {
        root /srv/imfde;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        root /srv/imfde;
        expires 7d;
        add_header Cache-Control "public";
    }
}

