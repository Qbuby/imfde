/* ====== 构建目录 ====== */
function buildTOC(){
  const frag=document.createDocumentFragment();
  TOC.forEach((item,i)=>{
    const a=document.createElement('a');
    a.className='lvl'+item.l; a.dataset.p=item.p; a.dataset.i=i;
    a.innerHTML=`<span class="pg">${item.p}</span>${item.t}`;
    a.addEventListener('click',()=>{ goTo(item.p); spyLock=true; setActive(i); if(innerWidth<=860) closeSide(); });
    frag.appendChild(a);
  });
  tocEl.appendChild(frag);
}
function setActive(i){
  tocEl.querySelectorAll('a.active').forEach(x=>x.classList.remove('active'));
  const el=tocEl.querySelector(`a[data-i="${i}"]`);
  if(el){ el.classList.add('active');
    const r=el.getBoundingClientRect(), cr=tocEl.getBoundingClientRect();
    if(r.top<cr.top+8||r.bottom>cr.bottom-8) el.scrollIntoView({block:'nearest'});
  }
}

/* 目录筛选 */
$('tocFilter').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  let n=0;
  tocEl.querySelectorAll('a').forEach(a=>{
    const hit=!q||a.textContent.toLowerCase().includes(q);
    a.style.display=hit?'':'none'; if(hit)n++;
  });
  $('tocEmpty').style.display=n?'none':'block';
});

/* ====== 页面容器 ====== */
function buildPages(){
  pagesEl.innerHTML=''; pageEls=[]; rendered.clear(); queue.length=0; running=0;
  for(let n=1;n<=TOTAL;n++){
    const wrap=document.createElement('div');
    const d=document.createElement('div');
    d.className='page'; d.dataset.n=n;
    d.style.width=Math.round(baseW*scale)+'px';
    d.style.height=Math.round(baseH*scale)+'px';
    d.innerHTML='<div class="ph">第 '+n+' 页</div>';
    const label=document.createElement('div');
    label.className='pagenum'; label.textContent=n+' / '+TOTAL;
    wrap.appendChild(d); wrap.appendChild(label);
    pagesEl.appendChild(wrap); pageEls.push(d);
  }
}

/* ====== 懒渲染 ====== */
function renderPage(n){
  if(rendered.has(n)||running>=3){ if(!rendered.has(n)&&!queue.includes(n))queue.push(n); return; }
  running++;
  pdf.getPage(n).then(page=>{
    const vp=page.getViewport({scale:scale*devicePixelRatio});
    const d=pageEls[n-1], ph=d.querySelector('.ph');
    const canvas=document.createElement('canvas');
    canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height);
    canvas.style.width=Math.round(vp.width/devicePixelRatio)+'px';
    canvas.style.height=Math.round(vp.height/devicePixelRatio)+'px';
    return page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise.then(()=>{
      if(!d.isConnected)return;
      const old=d.querySelector('canvas'); if(old)old.remove();
      d.appendChild(canvas);
      if(ph)ph.remove();
      d.style.height=canvas.style.height; d.style.width=canvas.style.width;
      rendered.add(n);
    });
  }).catch(()=>{}).finally(()=>{
    running--;
    const nx=queue.shift();
    if(nx)renderPage(nx);
  });
}
function renderVisible(){
  const vh=innerHeight, top=scrollY;
  pageEls.forEach(d=>{
    const t=d.offsetTop, b=t+d.offsetHeight;
    if(b>top-700&&t<top+vh+700){
      const n=+d.dataset.n;
      if(!rendered.has(n)&&!queue.includes(n))renderPage(n);
    }else{
      const c=d.querySelector('canvas'), n=+d.dataset.n;
      if(c&&(b<top-vh*1.5||t>top+vh+vhh()*1.5)){
        const w=Math.round(parseFloat(c.style.width)), h=Math.round(parseFloat(c.style.height));
        d.style.width=w+'px'; d.style.height=h+'px';
        c.remove(); d.insertAdjacentHTML('beforeend','<div class="ph">第 '+n+' 页</div>');
        rendered.delete(n);
      }
    }
  });
}
const vhh=()=>vh0||innerHeight; let vh0=0;

let ioStarted=false;

}

/* ====== 缩放 ====== */
function applyScale(s,fit){
  scale=Math.min(3,Math.max(0.4,s)); fitMode=!!fit;

  zoomPct.textContent=Math.round(scale*100)+'%';

  pageEls.forEach(d=>{
    d.style.width=Math.round(baseW*scale)+'px';
    d.style.height=Math.round(baseH*scale)+'px';
    const c=d.querySelector('canvas'); if(c)c.remove();
    if(!d.querySelector('.ph'))d.insertAdjacentHTML('beforeend','<div class="ph">第 '+(+d.dataset.n)+' 页</div>');
  });
  const keep=curPage||1;
  requestAnimationFrame(()=>{ renderVisible(); if(keep>1)jumpTo(keep,true); });
}
$('zoomIn').addEventListener('click',()=>{ zoomIdx=Math.min(ZOOMS.length-1,(fitMode?ZOOMS.findIndex(z=>z>=scale):zoomIdx)+1); applyScale(ZOOMS[zoomIdx],false); });
$('zoomOut').addEventListener('click',()=>{ zoomIdx=Math.max(0,(fitMode?ZOOMS.findIndex(z=>z>=scale):zoomIdx)-1); applyScale(ZOOMS[zoomIdx],false); });
$('zoomFit').addEventListener('click',()=>{ fitScale=Math.max(.4,Math.min(3,(viewerWidth()-40)/baseW)); applyScale(fitScale,true); });
const viewerWidth=()=>document.querySelector('.viewer').clientWidth;

/* ====== 跳转 / 滚动监听 ====== */
function pageTop(n){ return pageEls[n-1]?pageEls[n-1].offsetTop-8:0; }
function jumpTo(n,smooth){
  n=Math.min(TOTAL,Math.max(1,n));
  scrollTo({top:pageTop(n),behavior:smooth?'auto':'smooth'});
  history.replaceState(null,'','#p'+n);
}
function goTo(n){ jumpTo(n); }
$('prevBtn').addEventListener('click',()=>jumpTo(Math.max(1,curPage-1)));
$('nextBtn').addEventListener('click',()=>jumpTo(Math.min(TOTAL,curPage+1)));

let raf=0;
function onScroll(){ if(raf)return; raf=requestAnimationFrame(()=>{ raf=0;
  renderVisible();
  const top=scrollY+90; let cur=1;
  for(let n=1;n<=TOTAL;n++){ if(pageEls[n-1].offsetTop<=top)cur=n; else break; }
  if(cur!==curPage){ curPage=cur; pageNow.textContent='第 '+cur+' / '+TOTAL+' 页'; history.replaceState(null,'','#p'+cur); updateSpy(); }
});}
function updateSpy(){
  if(spyLock){ if(scrollY<50)spyLock=false; else return; }
  let best=0;
  for(let i=0;i<TOC.length;i++){ if(TOC[i].p<=curPage)best=i; else break; }
  const el=tocEl.querySelector(`a[data-i="${best}"]`);
  if(el&&!el.classList.contains('active'))setActive(best);
}
function onResize(){
  if(fitMode){ fitScale=Math.max(.4,Math.min(3,(viewerWidth()-40)/baseW)); applyScale(fitScale,true); }
  else renderVisible();
}

/* ====== 侧栏开合（窄屏） ====== */
$('menuBtn').addEventListener('click',()=>document.body.classList.toggle('side-open'));
$('backdrop').addEventListener('click',()=>closeSide());
function closeSide(){ document.body.classList.remove('side-open'); }

/* ====== 主流程 ====== */
function showError(){
  overlay.className='overlay err';
  ovMsg.innerHTML='PDF 加载失败。直接双击打开本页（file:// 协议）会被浏览器拦截，请通过 HTTP 访问<br>（如 <code>python -m http.server</code> 或部署到 GitHub Pages），<br>或 <a href="'+PDF_URL+'" download>下载 PDF</a> 后本地阅读。';
}
buildTOC();
const loadingTask=pdfjsLib.getDocument({url:PDF_URL});
loadingTask.onProgress=({loaded,total})=>{
  if(total)ovMsg.textContent='正在加载 PDF… '+Math.min(100,Math.round(loaded/total*100))+'%';
  else ovMsg.textContent='正在加载 PDF… '+(loaded/1024/1024).toFixed(1)+' MB';
};
loadingTask.promise.then(doc=>{
  pdf=doc; TOTAL=doc.numPages;
  return pdf.getPage(1).then(p1=>{
    const vp=p1.getViewport({scale:1});
    baseW=vp.width; baseH=vp.height;
    fitScale=Math.max(.4,Math.min(3,(viewerWidth()-40)/baseW));
    scale=fitScale; zoomPct.textContent=Math.round(scale*100)+'%';
    buildPages();
    overlay.style.display='none';
    pageNow.textContent='第 1 / '+TOTAL+' 页';
    updateSpy();
    /* 深链 #p{n} */
    const m=location.hash.match(/^#p(\d+)$/);
    if(m){ jumpTo(+m[1],true); curPage=+m[1]; }
    renderVisible(); startObserver();
    vh0=innerHeight;
  });
}).catch(err=>{ console.error(err); showError(); });
</script>
</body>
