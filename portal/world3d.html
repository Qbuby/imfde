arious income streams within one all-in-one creator platform, aiming to take away some of the backend administrative stress of running your own business. Fourthwall offers a white-label website with built-in tools for setting up merch stores, membership programs, accepting donations, and more, with over 200 different types of products that creators can develop to sell through their website. Content creators are not an easy audience to please, often skeptical of new products and demanding of high-quality customer support. Fourthwall's team was looking for a way to scale their customer support operation without sacrificing the quality of the customer experience.…","title_short":"Fourthwall","kicker":"Decagon","sub":"Fourthwall 公开用 Decagon 做客服：创作者社区、知识库加历史工单。","host":"decagon.ai","url":"https://decagon.ai/case-studies/fourthwall","orig_href":"/原文/动态/396","doc_type":"case_study","doc_label":"客户故事","vendor":"Decagon","vendor_slug":"decagon","customer":"Fourthwall","customer_named":true,"evidence":"medium","kpi":"narrative","kpi_label":"公司自己讲的数字","outcome":"70%+ 工单无需人眼解决；CSAT 与解决率远超预期；创作者社区接受度高；Decagon 团队快速响应 feature 请求","product":"","quote":"创作者对 AI 极其戒备，对机器人没什么耐心。Decagon 交付的 AI 方案超出了我们和内容创作者的预期，尤其是非常类人、对话式。我们现在完整解决超过 70% 的入站工单，Decagon 的方案实际上是一个高功能 agent，即时给出个性化回复，并且始终在线。我们很兴奋在业务扩展时继续与他们合作。——Eli Valentin，Fourthwall 首席运营官","href":"/动态/396","case_href":"/案例/406","happened":"Fourthwall 公开用 Decagon 做客服：创作者社区、知识库加历史工单。","why":"创作者（YouTube/Twitch 等）难讨好、要求高；需规模化支持不牺牲体验；要类人对话而非 canned chatbot。","enterprise":"70% 以上工单无需人眼解决。满意度和解决率是页面上的说法，不是审计结果。","practitioner":"现场会碰到功能要得很快，厂商的人一起改。","entity_key":"decagon","entity_slug":"decagon","entity_name":"Decagon","info_kind":"dated_case_study"},{"id":501,"lane":"people","day":"2026-07-28","date_kind":"published","signal":"mid","title":"Natalie Meurer：驻场的脏秘密","orig_title":"The Dirty Secret of Forward Deployed Engineering — Natalie Meurer, Sierra","orig_excerpt":"","title_short":"Natalie · AIEWF","kicker":"Natalie Meurer","sub":"Natalie Meu d across key sectors of the economy. It provides solutions for Loyalty, Communications, Finance, Retail, and ERP. As an AI-first company, Comarch focuses on leveraging new technologies to optimize operational processes and on developing AI-driven solutions that deliver real business value to its clients. Comarch’s services have been trusted by tens of thousands of world-renowned brands in over 100 countries across six continents, including Allianz, BNP Paribas, BP, Carrefour, ING, Orange, Telefónica, T-Mobile, Vodafone, and Heineken.…","title_short":"Comarch","kicker":"Factory","sub":"Comarch 公开用 Factory 做内部软件工厂、把迁移和现代化收成 Mission。","host":"factory.ai","url":"https://factory.ai/case-studies/comarch","orig_href":"/原文/动态/101","doc_type":"case_study","doc_label":"客户故事","vendor":"Factory","vendor_slug":"factory","customer":"Comarch","customer_named":true,"evidence":"high","kpi":"narrative","kpi_label":"公司自己讲的数字","outcome":"工程师效率提升 40%，团队速率高 30-34%。此前超过一年的项目快 18 倍。XSLT 现代化：估计 10,000 人天 → 用 Factory 45 天。数据库迁移：范围 45 天 → 6 小时。航空公司客户故事实现：18 个月 → 1 周 MVP。数百名 Comarch 工程师使用 Factory。","product":"","quote":"人白天带着喜悦工作。Factory 完成工作，第二天早上由人接手。——Dr. Łukasz Bolikowski，Chief AI Officer @ Comarch","href":"/动态/101","case_href":"/案例/101","happened":"Comarch 公开用 Factory 做内部软件工厂、把迁移和现代化收成 Mission。","why":"建设内部软件工厂，使 Comarch 能更快向客户交付更好的产品，同时不放弃数十年经验积累的人工治理层。","enterprise":"工程师效率约 40%、团队速度约 30–34%；XSLT 现代化从估 1 万人天收到 45 天。这是公司自己讲的。","practitioner":"人定方向、识别客户上下文、做架构决策、决定什么上线。工程师在高杠杆决策上运用判断（如何为特定客户构建、优先做什么）。团队称之为夜班和周末班。","entity_key":"factory","entity_slug":"factory","entity_name":"Factory","info_kind":"dated_case_study"},{"id":476,"lane":"method","day":"2026-07-29","date_kind":"published","signal":"mid","title":"驻场入门：何时需要这支队伍","orig_title":"FDE 101 - by The FDE Pod by Kevin Bai","orig_excerpt":"FDE 101 I gave the FDE 101 talk to a thousand AI engineers. It's a design partnership that scales into enterprise and never ends. The FDE Pod by Kevin Bai Jul 29, 2026 12 2 Share Last month I stood on a stage at the AI Engineer World’s Fair and gave a talk on forward deployed engineering to a thousand AI engineers. Here’s the whole thing: where FDE came from, why Palantir bet its entire go-to-market on it, the two questions to ask before you build one, and why I think a lot more of you are about to need one whether you planned on it or not. Start with the number Look at public SaaS companies and measure them by average contract value, meaning how much a given customer spends with you in a year. Palantir is first, at around $4 million. Next is ServiceNow at $1.2 million. Then Workday, around $800K.…","title_short":"驻场入门","kicker":"The FDE Pod","sub":"The FDE Pod 讨论何时需要驻场团队。","host":"fdepod.substack.com","url":"https://fdepod.substack.com/p/fde-101","orig_href":"/原文/动态/476","doc_type":"podcast_episode","doc_label":"播客","vendor":"","vendor_slug":"","customer":"","customer_named":false,"evidence":"medium","kpi":"narrative","kpi_label":"公司自己讲的数字","outcome":"公开 SaaS 平均合同价值对比数据（Palantir 约 400 万美元 / ServiceNow 120 万 / Workday 约 80 万 / Snowflake 32.2 万 / Salesforce 25.2 万 / Azure 21.4 万），为行业市场数据而非项目 KPI。","product":"","quote":"如果你立起一支 FDE 职能，但每个 FDE 都从零构建，那你没有 FDE 职能。你有的是一家开发作坊。","href":"/动态/476","case_href":"","happened":"The FDE Pod 讨论何时需要驻场团队。","why":"","enterprise":"讨论何时需要驻场团队。合同价值和团队规模是播客里的对照，不当审计。","practitioner":"驻场被写成面向客户的软件工程师：顾问、产品和工程三顶帽子轮着戴。","entity_key":"fdepod.substack.com","entity_slug":"","entity_name":"The FDE Pod","info_kind":"podcast_episode"},{"id":503,"lane":"company","day":"2026-08-03","date_kind":"published","signal":"high","title":"Palantir 2026 Q2 股东信","orig_title":"Q2 2026","orig_excerpt":"","title_short":"Palantir · 股东信","kicker":"Palantir","sub":"Palantir 2026 年第二季度股东信里，继续把驻场团队写成经营上怎么讲。","host":"palantir.com","url":"https://www.palantir.com/q2-2026-letter/en/","orig_href":"","doc_type":"earnings_letter","doc_label":"股东信","vendor":"Palantir","vendor_slug":"palantir","customer":"","customer_named":false,"evidence":"","kpi":"","kpi_label":"","outcome /周升至 170（3x）。由 Devin 创建的后端 PR 占比从 18% 升至 82%。页面主视觉还写到新产品估计 2–3x 加速，从 10 周到 4 周（稳定币团队正在为智能体集群结构化工作；预期）。","product":"Devin","quote":"使用 Devin 感觉像一种神奇体验：它能搞清楚工程师从端到端测试角度需要什么，并把 PR 推到终点，达到可供人工审查的程度。 — Luis，工程与数据负责人","href":"/动态/82","case_href":"/案例/82","happened":"Común 公开 13 人工程组用 Devin 把后端 PR 从每周约 50 提到约 170。","why":"13 人工程团队需要上线 WhatsApp、彻底改造争议处理、推进稳定币，并构建应用内 AI 助手，同时不能按路线图规模招人。","enterprise":"四周内后端产出约 3 倍；页面还写新项目估计 2–3 倍加速。这是公司自己讲的客户故事，不是第三方审计。","practitioner":"人聚焦最终 PR 审查；产品经理请 Devin 调查/修复，由工程师验证并合并。","entity_key":"cognition","entity_slug":"cognition","entity_name":"Cognition","info_kind":"dated_case_study"},{"id":453,"lane":"people","day":"2026-08-27","date_kind":"published","signal":"high","title":"Cohere：驻场建能力，不制造依赖","orig_title":"FDEs: Building Capacity, Not Dependency | Cohere","orig_excerpt":"The main bottleneck in enterprise AI adoption has shifted downstream from experimentation to production deployment. Proving that AI can perform useful tasks under controlled conditions is one thing, but adapting it to the real-world operating environment of an enterprise can be a much more complex undertaking. Many enterprises stall at this bottleneck. According to Deloitte’s 2026 State of AI in the Enterprise report, only 25% of organizations have moved 40% or more of their AI pilots into production. Enterprises have a few options for closing this deployment gap. They can tackle the work internally, but doing so may require specialized AI deployment expertise, familiarity with the underlying technology, and sufficient engineering capacity.…","title_short":"Cohere · 建能力","kicker":"Cohere","sub":"Cohere 公开写 FDE 的职责是帮客户建能力，而不是制造对厂商的长期依赖。","host":"cohere.com","url":"https://cohere.com/blog/forward-deployed-engineers-capability-building","orig_href":"/原文/动态/453","doc_type":"named_essay","doc_label":"看法","vendor":"Cohere","vendor_slug":"cohere","customer":"匿名客户（Cohere客户）","customer_named":false,"evidence":"medium","kpi":"","kpi_label":"","outcome":"","product":"","quote":"该智能体频繁失败，是因为它的指令引用了并不存在的工具，同时部分底层工具调用无法承载所需的上下文。我们的 FDE 重建了智能体，并修改了配套工具——包括其 Slack 集成——以处理更大的上下文。","href":"/动态/453","case_href":"","happened":"Cohere 公开写 FDE 的职责是帮客户建能力，而不是制造对厂商的长期依赖。","why":"","enterprise":"Cohere 把驻场写成帮客户建能力、不制造依赖。买驻场前要问：撤场后自己的人能不能接着跑。","practitioner":"诊断根因、改 agent 和底层工具，并判断问题该走部署侧还是产品侧。这是职责描述，不是某一单客户的结果数字。","entity_key":"cohere","entity_slug":"cohere","entity_name":"Cohere","info_kind":"named_essay"},{"id":536,"lane":"method","day":"2026-08-27","date_kind":"published","signal":"low","title":"OpenAI：招聘 Applied AI 经理（Codex）","orig_title":"Manager, Applied AI Engineering (Codex)","orig_excerpt":"","title_short":"OpenAI · Codex","kicker":"OpenAI","sub":"OpenAI 在招聘网站上新挂了「Applied AI 经理（Codex）」。这是在招人，不是宣布组织已经建成。","host":"jobs.ashbyhq.com","url":"https://jobs.ashbyhq.com/openai/b28b990c-54e4-4be4-a33a-d5518dc3e117","orig_href":"","doc_type":"job_posting","doc_label":"招聘","vendor":"","vendor_slug":"","customer":"","customer_named":false,"evidence":"","kpi":"","kpi_label":"","outcome":"","product":"","quote":"","href":"/动态/536","case_href":"","happened":"OpenAI 在招聘网站上新挂了「Applied AI 经理（Codex）」。这是在招人，不是宣布组织已经建成。","why":"OpenAI 在招「Applied AI 经理（Codex）」。","enterprise":"","practitioner":"OpenAI 这个岗位标题是「Applied AI 经理（Codex）」。具体干什么以招聘启事为准。","entity_key":"openai","entity_slug":"openai","entity_name":"OpenAI","info_kind":"job_posting"},{"id":539,"lane":"method","day":"2026-08-27","date_kind":"published","signal":"low","title":"OpenAI：招聘驻场, Legal-SF","orig_title":"Forward Deployed Engineer (FDE), Legal-SF","orig_excerpt":"","title_short":"OpenAI · Legal-SF","kicker":"OpenAI","sub":"OpenAI 在招聘网站上新挂了「FDE, Legal-SF」。这是在招人，不是宣布组织已经建成。","host":"jobs.ashbyhq.com","url":"https://jobs.ashbyhq.com/openai/832094fd-4d89-4fe4-bc18-9ba88d347a18","orig_href":"","doc_type":"job_posting","doc_label":"招聘","vendor":"","vendor_slug":"","customer":"","customer_named":false,"evidence":"","kpi":"","kpi_label":"","outcome":"","product":"","quote":"","href":"/动态/539","case_href":"","happened" 驱动消费，文中写不一定亲自实施。","why":"这张图上同时有公司在招（Databricks、OpenAI、Cohere）和服务商说要扩到 750 人（Blend360）。这条评论把「还在招」说成「能做出回报的人很少」。公开说法从「驻场是什么」转到「尖子不够用」。1.7 万 / 2000 仍是猎头自己的说法，不是普查。","enterprise":"和最近这段扩招、扩编并读：若买方接受「Elite 约 2000」，自己招齐能出回报的人更难，更可能继续买驻场 / 服务商。A&D 还被说成关系驱动。买之前问清楚买的是驻场交付还是政府关系。","practitioner":"最近这些岗位从 TPM、经理到初级都在挂。文中把「头衔人数」和「能出回报」拆开，晋升叙事是跟 Elite 做规模题。投递时对着 JD 分清是写系统还是推消费。","entity_key":"ross-wilkers","entity_slug":"ross-wilkers","entity_name":"Ross Wilkers","info_kind":"named_essay"},{"id":530,"lane":"method","day":"2026-09-01","date_kind":"published","signal":"low","title":"Databricks：招聘 资深 AI 驻场经理","orig_title":"Sr. Manager, AI Forward Deployed Engineering (AI-FDE)","orig_excerpt":"","title_short":"Databricks · 招聘 资深 AI 驻场经理","kicker":"Databricks","sub":"Databricks 在招聘网站上新挂了「AI-FDE 经理」。这是在招人，不是宣布组织已经建成。","host":"databricks.com","url":"https://databricks.com/company/careers/open-positions/job?gh_jid=8770300002","orig_href":"","doc_type":"job_posting","doc_label":"招聘","vendor":"","vendor_slug":"","customer":"","customer_named":false,"evidence":"","kpi":"","kpi_label":"","outcome":"","product":"","quote":"","href":"/动态/530","case_href":"","happened":"Databricks 在招聘网站上新挂了「AI-FDE 经理」。这是在招人，不是宣布组织已经建成。","why":"Databricks 在招「AI-FDE 经理」。","enterprise":"","practitioner":"Databricks 这个岗位标题是「AI-FDE 经理」。具体干什么以招聘启事为准。","entity_key":"databricks","entity_slug":"databricks","entity_name":"Databricks","info_kind":"job_posting"},{"id":534,"lane":"method","day":"2026-09-01","date_kind":"published","signal":"low","title":"Databricks：招聘 AI 驻场","orig_title":"AI Engineer - FDE (Forward Deployed Engineer)","orig_excerpt":"","title_short":"Databricks · 招聘 AI 驻场","kicker":"Databricks","sub":"Databricks 在招聘网站上新挂了「AI FDE」。这是在招人，不是宣布组织已经建成。","host":"databricks.com","url":"https://databricks.com/company/careers/open-positions/job?gh_jid=8760282002","orig_href":"","doc_type":"job_posting","doc_label":"招聘","vendor":"","vendor_slug":"","customer":"","customer_named":false,"evidence":"","kpi":"","kpi_la
