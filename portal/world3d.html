pace? The answer wasn’t just adopting new technology — it was rethinking IT’s role from service provider to enabler. With WRITER as their partner, Beauty Pie’s lean 2-person data team sparked a viral adoption movement: 248 playbooks, 38 active triggers, and 135% monthly active user growth.…","title_short":"Beauty Pie","kicker":"Writer","sub":"Beauty Pie 公开说，业务人员用 Writer 自己搭 playbook。","host":"writer.com","url":"https://writer.com/blog/beauty-pie-customer-story/","orig_href":"/原文/动态/348","doc_type":"case_study","doc_label":"客户故事","vendor":"Writer","vendor_slug":"writer","customer":"Beauty Pie","customer_named":true,"evidence":"high","kpi":"narrative","kpi_label":"公司自己讲的数字","outcome":"创建 248 个 playbook；38 个活跃触发器跨五个部门自动化工作流；月活用户增长 135%。NPD：10 名用户独立构建 10+ 个 playbook。","product":"","quote":"要点是把结构化与非结构化数据放到一起，让非技术或非数据的人能说：「我想更理解这个。」——Sara Sheridan，Beauty Pie 前数据与 AI 副总裁","href":"/动态/348","case_href":"/案例/354","happened":"Beauty Pie 公开说，业务人员用 Writer 自己搭 playbook。","why":"交付一致的客户体验并解锁客户智能，而不扩大 2 人数据/IT 团队。","enterprise":"248 个 playbook、38 个自动触发器，覆盖五个部门；月活用户增长 135%。这是 Writer 自己讲的客户故事。","practitioner":"IT 搭台，业务自己配流程，没有强制推广。","entity_key":"writer","entity_slug":"writer","entity_name":"Writer","info_kind":"dated_case_study"},{"id":370,"lane":"deploy","day":"2026-08-05","date_kind":"published","signal":"high","title":"先锋领航","orig_title":"The Agentic CMO: How Vanguard's Colin Kelton Rebuilt Marketing From the Inside Out","orig_excerpt":"Bridget Heaton | August 5, 2026 At WRITER’s Agentic Enterprise event in London, Colin Kelton — recently retired Chief Marketing Officer at Vanguard, and one of the longest-tenured CMOs at a major financial institution — joined WRITER CEO May Habib on stage to discuss why marketing leadership has to evolve before the organization ever can. From Brand Guardian to Organizational Architect Over eight years as Vanguard’s first global CMO, Kelton built a perspective that most marketers are still working toward. He’s watched the CMO role shift, sometimes uncomfortably, from what he calls “brand guardian” to something far more consequential: organizational architect. The distinction matters. A brand guardian approves copy. An organizational architect builds the systems that make great work possible at scale — without the gatekeeper in the middle.…","title_short":"先锋领航","kicker":"Writer","sub":"Vanguard 公开用 Writer 重做营销邮件工作流：基线是 37 步、16 次人工交接。","host":"writer.com","url":"https://writer.com/blog/vanguard-customer-story-2026/","orig_href":"/原文/动态/370","doc_type":"case_study","doc_label":"客户故事","vendor":"Writer","vendor_slug":"writer","customer":"先锋领航","customer_named":true,"evidence":"high","kpi":"narrative","kpi_label":"公司自己讲的数字","outcome":"流程地图：生产一封邮件 37 步和 16 次人工交接（基线）。狂热者小组用两天产出过去要三周的工作。早期虚荣指标：75 名桌面用户尚未改变工作。顾问反应：「这听起来像你真的了解我的客户。」","product":"","quote":"我们找到一些狂热者、真正的信徒——真正想改变我们做事方式的人——我授权了那一组。他们的工作更快了，他们能做更多。——Colin Kelton，Vanguard 退休首席营销官","href":"/动态/370","case_href":"/案例/376","happened":"Vanguard 公开用 Writer 重做营销邮件工作流：基线是 37 步、16 次人工交接。","why":"停止铺 1990 年代营销牛径（一封邮件 37 步和 16 次人工交接），并用 agent 重建工作流。","enterprise":"早期小组两天做出过去三周的量。页面也写了尚未改变工作方式的桌面用户数，不要只读加速比。","practitioner":"找到狂热者（约小组，不是 700）。CMO 被告知自己进产品。顾问对个性化资产作出反应。","entity_key":"writer","entity_slug":"writer","entity_name":"Writer","info_kind":"dated_case_study"},{"id":551,"lane":"method","day":"2026-08-06","date_kind":"published","signal":"mid","title":"Plank：8 月驻场简报","orig_title":"The FDE Brief: August 2026","orig_excerpt":"","title_short":"Plank · 8 月简报","kicker":"Plank","sub":"Plank 8 月 FDE 简报：人才供给大约 2000 人、Palantir Q2、以及买方是自建还是外购现场工程师。","host":"joinplank.com","url":"https://joinplank.com/fde-news/august-2026","orig_href":"","doc_type":"methodology","doc_label":"怎么做","vendor":"","vendor_slug":"","customer":"","customer_named":false,"evidence":"","kpi":"","kpi_label":"","outcome":"","product":"","quote":"","href":"/动态/551","case_href":"","happened":"Plank 8 月 FDE 简报：人才供给大约 2000 人、Palantir Q2、以及买方是自建还是外购现场工程师。","why":"","enterprise":"简报把人才供给、Palantir Q2 和「自建还是 0 人，理由是企业要把 AI 嵌进生产。","why":"","enterprise":"这是服务商自己的扩编目标，不是买方公司自己的团队，也还不是已经到岗的人数。","practitioner":"现场工程岗位还在扩。工作方式不能自动当成 Palantir 或 OpenAI 那种驻场。","entity_key":"blend360","entity_slug":"blend360","entity_name":"Blend360","info_kind":"org_announcement"},{"id":453,"lane":"people","day":"2026-08-27","date_kind":"published","signal":"high","title":"Cohere：驻场建能力，不制造依赖","orig_title":"FDEs: Building Capacity, Not Dependency | Cohere","orig_excerpt":"The main bottleneck in enterprise AI adoption has shifted downstream from experimentation to production deployment. Proving that AI can perform useful tasks under controlled conditions is one thing, but adapting it to the real-world operating environment of an enterprise can be a much more complex undertaking. Many enterprises stall at this bottleneck. According to Deloitte’s 2026 State of AI in the Enterprise report, only 25% of organizations have moved 40% or more of their AI pilots into production. Enterprises have a few options for closing this deployment gap. They can tackle the work internally, but doing so may require specialized AI deployment expertise, familiarity with the underlying technology, and sufficient engineering capacity.…","title_short":"Cohere · 建能力","kicker":"Cohere","sub":"Cohere 公开写 FDE 的职责是帮客户建能力，而不是制造对厂商的长期依赖。","host":"cohere.com","url":"https://cohere.com/blog/forward-deployed-engineers-capability-building","orig_href":"/原文/动态/453","doc_type":"named_essay","doc_label":"看法","vendor":"Cohere","vendor_slug":"cohere","customer":"匿名客户（Cohere客户）","customer_named":false,"evidence":"medium","kpi":"","kpi_label":"","outcome":"","product":"","quote":"该智能体频繁失败，是因为它的指令引用了并不存在的工具，同时部分底层工具调用无法承载所需的上下文。我们的 FDE 重建了智能体，并修改了配套工具——包括其 Slack 集成——以处理更大的上下文。","href":"/动态/453","case_href":"","happened":"Cohere 公开写 FDE 的职责是帮客户建能力，而不是制造对厂商的长期依赖。","why":"","enterprise":"Cohere 把驻场写成帮客户建能力、不制造依赖。买驻场前要问：撤场后自己的人能不能接着跑。","practitioner":"诊断根因、改 agent 和底层工具，并判断问题该走部署侧还是产品侧。这是职责描述，不是某一单客户的结果数字。","entity_key":"cohere","entity_slug":"co ase_study"},{"id":550,"lane":"people","day":"2026-09-01","date_kind":"published","signal":"mid","title":"Ross Wilkers：驻场人才短缺","orig_title":"A subset of the tech talent supply crunch to watch out for","orig_excerpt":"","title_short":"Ross · 人才短缺","kicker":"Ross Wilkers","sub":"9 月 1 日 Washington Technology 把驻场写成「技术人才短缺里的短缺」。引 Christian & Timbers：美国约 1.…","host":"washingtontechnology.com","url":"https://www.washingtontechnology.com/companies/2026/09/subset-tech-talent-supply-crunch-watch-out/415572/","orig_href":"","doc_type":"named_essay","doc_label":"看法","vendor":"","vendor_slug":"","customer":"","customer_named":false,"evidence":"","kpi":"","kpi_label":"","outcome":"","product":"","quote":"","href":"/动态/550","case_href":"","happened":"9 月 1 日 Washington Technology 把驻场写成「技术人才短缺里的短缺」。引 Christian & Timbers：美国约 1.7 万名 FDE，约 2000 人被称作 Elite（企业 AI 做成有记录回报）。JC Christian 给的扩法是初级跟 Elite 做「有把握能赢」的规模题。国防承包商被写成同一困境；A&D 更偏政府关系和驱动消费，文中写不一定亲自实施。","why":"这张图上同时有公司在招（Databricks、OpenAI、Cohere）和服务商说要扩到 750 人（Blend360）。这条评论把「还在招」说成「能做出回报的人很少」。公开说法从「驻场是什么」转到「尖子不够用」。1.7 万 / 2000 仍是猎头自己的说法，不是普查。","enterprise":"和最近这段扩招、扩编并读：若买方接受「Elite 约 2000」，自己招齐能出回报的人更难，更可能继续买驻场 / 服务商。A&D 还被说成关系驱动。买之前问清楚买的是驻场交付还是政府关系。","practitioner":"最近这些岗位从 TPM、经理到初级都在挂。文中把「头衔人数」和「能出回报」拆开，晋升叙事是跟 Elite 做规模题。投递时对着 JD 分清是写系统还是推消费。","entity_key":"ross-wilkers","entity_slug":"ross-wilkers","entity_name":"Ross Wilkers","info_kind":"named_essay"},{"id":530,"lane":"method","day":"2026-09-01","date_kind":"published","signal":"low","title":"Databricks：招聘 资深 AI 驻场经理","orig_title":"Sr. Manager, AI Forward Deployed Engineering (AI-FDE)","orig_excerpt":"","title_short":"Databricks · 招聘 资深 AI 驻场经理","kicker":"Databricks","sub":"Databricks 在招聘网站上新挂了「AI-FDE 经理」。这是在招人，不是宣布组织已经建成。","host":"databricks.com","url":"https://databricks.com/company/careers/open-positions/job?gh_jid=8770300002","orig_href":"","doc_type":"job_posting","doc_label":"招聘","vendor":"","vendor_slug":"","customer":"","customer_named":false,"evidence":"","kpi":"","kpi_
